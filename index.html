<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3440">
<title>중마고 GPS 길찾기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 지도 중심 한 화면 — 전체 화면 층 지도 위에 검색창·층 선택·내 위치 버튼, 아래 시트에 출발/경로 미리보기 */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#111a2b; --muted:#6b7687; --line:#e4e8ee; --soft:#f6f8fb;
  --navy:#0f3440; --navy-2:#16495a; --on-navy:#ffffff; --on-navy-dim:#9fc3cc;
  --accent:#0e7490; --accent-soft:#dff3f7; --start:#12a160; --end:#ef4436; --sign:#ffcc29; --sign-ink:#15294d;
  --floor:#e9edf3; --room:#fff6d6; --room-s:#e3ecff; --room-o:#eff1f5; --wc:#ece6f7; --room-g:#dcf3e6;
  --shadow:0 1px 2px rgba(17,26,43,.06),0 6px 20px rgba(17,26,43,.06);
  --f1:#0e9384; --f2:#2f6bff; --f3:#7a4fe0; --f4:#dd6a12;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1017; --surface:#151c27; --ink:#e9eef5; --muted:#909bad; --line:#243042; --soft:#1a2330;
  --navy:#0a2530; --navy-2:#12394a; --on-navy:#ffffff; --on-navy-dim:#86b0bb;
  --accent:#22b8cf; --accent-soft:#123844; --start:#38c985; --end:#ff6a5c;
  --floor:#1e2836; --room:#3a3420; --room-s:#1f3152; --room-o:#252f3c; --wc:#2c2744; --room-g:#1b392a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1017; --surface:#151c27; --ink:#e9eef5; --muted:#909bad; --line:#243042; --soft:#1a2330;
  --navy:#0a2530; --navy-2:#12394a; --on-navy:#ffffff; --on-navy-dim:#86b0bb;
  --accent:#22b8cf; --accent-soft:#123844; --start:#38c985; --end:#ff6a5c;
  --floor:#1e2836; --room:#3a3420; --room-s:#1f3152; --room-o:#252f3c; --wc:#2c2744; --room-g:#1b392a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.gut{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--navy);color:var(--on-navy);border-radius:0 0 22px 22px}
.top .gut{padding-block:18px 18px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-size:17px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;letter-spacing:-.02em}
.brand small{display:block;font-size:12px;color:var(--on-navy-dim);line-height:1.2}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.brand .where{margin-left:auto;font-size:12px;color:var(--on-navy-dim);border:1px solid var(--navy-2);border-radius:999px;padding:4px 10px}

.route-box{background:var(--surface);color:var(--ink);border-radius:16px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.rb-rows{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.rb-rows::before{content:"";position:absolute;left:4px;top:25px;bottom:25px;border-left:2px dotted var(--line)}
.rb-row{display:flex;align-items:center;gap:12px;min-height:50px}
.rb-row+.rb-row{border-top:1px solid var(--line)}
.pin{flex:none;width:10px;height:10px;border-radius:50%;background:var(--start);box-shadow:0 0 0 3px color-mix(in srgb,var(--start) 22%,transparent);position:relative;z-index:1}
.pin.e{background:var(--end);box-shadow:0 0 0 3px color-mix(in srgb,var(--end) 22%,transparent)}
.rb-row select,.rb-row input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:12px 0;outline:none;-webkit-appearance:none;appearance:none}
.rb-row select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px;cursor:pointer}
.rb-row input::placeholder{color:var(--muted)}
.rb-row input:focus-visible{outline:none}
.rb-row:focus-within{box-shadow:inset 0 -2px 0 var(--accent)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.searchwrap{flex:1;min-width:0;position:relative;display:flex}
.sugg{position:absolute;left:-36px;right:-52px;top:calc(100% + 8px);z-index:20;list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:min(62vh,460px);overflow:auto;overscroll-behavior:contain}
.sugg li button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:10px;cursor:pointer;color:var(--ink)}
.sugg li button:hover,.sugg li button:focus-visible{background:var(--soft)}
.sugg li button[disabled]{color:var(--muted);cursor:default;font-size:14px}
.sugg .floors{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px}
.sugg .floors button{all:unset;box-sizing:border-box;text-align:center;padding:10px 0;border-radius:10px;font-weight:800;color:#fff;cursor:pointer}
.sugg .cap{font-size:12px;color:var(--muted);padding:6px 10px 0}
.fb{display:inline-grid;place-items:center;flex:none;min-width:36px;height:22px;padding:0 7px;border-radius:7px;font-size:12px;font-weight:800;color:#fff;background:var(--muted);line-height:1;vertical-align:1px}
.f1{background:var(--f1)!important}.f2{background:var(--f2)!important}.f3{background:var(--f3)!important}.f4{background:var(--f4)!important}.fx{background:var(--accent)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.flow .via{display:flex;align-items:center;gap:4px}
.connector{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;margin:-2px 0 -2px 14px;padding:8px 0 8px 16px;border-left:3px dashed var(--line)}
.connector .si{flex:none}
.tapmode{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tapmode .seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.tapmode .seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.tapmode .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,26,43,.12)}

/* main */
main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
main .gut{display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:2px 2px -4px;letter-spacing:.02em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px 8px 10px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip svg{color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}

/* result */
.route-title{font-size:13px;color:var(--muted);margin:0}
.summary{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:-8px}
.summary .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.summary .meta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
ol.steps{list-style:none;margin:0;padding:12px 14px;display:flex;flex-direction:column;background:var(--soft);border-radius:14px}
ol.steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:7px 0;position:relative;align-items:center}
ol.steps li::before{content:"";position:absolute;left:12px;top:calc(50% + 13px);height:calc(100% - 12px);width:2px;background:var(--line)}
ol.steps li:last-child::before{display:none}
.si{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--accent);position:relative;z-index:1}
.si.s{background:var(--start)}.si.e{background:var(--end)}.si.st{background:var(--navy-2)}
.maps{display:flex;flex-direction:column;gap:14px}
.floorhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.floorhead b{font-size:14px;height:26px;padding:0 10px}
.floorhead span{font-size:13px;color:var(--muted)}
.mapbox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.mapbox svg{display:block;height:auto}
.empty{color:var(--muted);margin:0;text-align:center;padding:18px 0}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* map drawing */
.area{fill:var(--floor)}
.room{stroke:var(--surface);stroke-width:1.5}
.t-c{fill:var(--room)}.t-s{fill:var(--room-s)}.t-o,.t-l{fill:var(--room-o)}.t-w{fill:var(--wc)}.t-g{fill:var(--room-g)}.t-h{fill:var(--floor);stroke:var(--muted);stroke-dasharray:4 3}.t-e{fill:var(--surface);stroke:var(--muted);stroke-dasharray:3 2}.t-d{fill:var(--room-o)}
.room.hl-end{fill:var(--end);fill-opacity:.22;stroke:var(--end);stroke-width:2}
.room.hl-start{fill:var(--start);fill-opacity:.2;stroke:var(--start);stroke-width:2}
.lbl{fill:var(--ink);font-family:var(--body);font-weight:500;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.stair{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.hatch{stroke:var(--muted);stroke-width:.7}
.stair.use{stroke:var(--accent);stroke-width:2.5}
.path{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.path-dash{fill:none;stroke:var(--surface);stroke-width:1.6;stroke-dasharray:4 9;stroke-linecap:round;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
@media (prefers-reduced-motion:reduce){.path-dash{animation:none}}
.mk-s{fill:var(--start);stroke:var(--surface);stroke-width:2}
.mk-e{fill:var(--end);stroke:var(--surface);stroke-width:2}

/* floor view */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.tabs.b2{grid-template-columns:1fr 1fr}
.bridge{fill:var(--accent-soft)}
.blbl{fill:var(--accent);font-weight:700}
.tab{border:0;background:transparent;border-radius:9px;padding:8px 0;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,26,43,.12)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hint{font-size:13px;color:var(--muted);margin:0}

/* qr */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
.btn{border:0;background:var(--accent);color:#fff;font-weight:700;border-radius:12px;padding:14px;cursor:pointer;font-size:16px}
#qrout{display:flex;flex-direction:column;align-items:center;gap:10px}
#qrout .qrbox{background:#fff;padding:16px;border-radius:16px;border:1px solid var(--line)}
#qrout code{font-size:12px;word-break:break-all;color:var(--muted);text-align:center}
.note{font-size:13px;color:var(--muted);margin:0}

/* floor directory */
.dir-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dir-head b{font-size:17px;font-weight:800}
.seg2{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg2 button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(17,26,43,.12)}
.dir-list{display:flex;flex-direction:column}
.dir-floor{display:grid;grid-template-columns:44px 1fr;gap:10px;padding-block:12px;border-top:1px solid var(--line);align-items:start}
.dir-floor:first-child{border-top:0;padding-top:4px}
.dir-floor .fb{height:26px;margin-top:3px}
.dir-places{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pl{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--ink)}
.pl:hover{border-color:var(--accent)}
.pl.p-c{background:var(--room)}.pl.p-s{background:var(--room-s)}.pl.p-g{background:var(--room-g)}.pl.p-w{background:var(--wc)}.pl.p-o,.pl.p-l,.pl.p-h{background:var(--room-o)}
.pl[aria-current="true"]{border-color:var(--end);box-shadow:0 0 0 2px var(--end);font-weight:700}
.pl.here{border-color:var(--start);box-shadow:0 0 0 2px var(--start)}

/* GPS 전용 */
.locbtn{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer}
#sugg-from{right:-96px}
#nv-mode{cursor:default}
.nv-ctrl{grid-template-columns:1fr 1.6fr}
.gpsnote{margin:-4px 0 0}
/* GPS */
.btn:disabled{opacity:.55;cursor:default}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cal-head b{font-size:17px;font-weight:800}
.cal-badges{display:flex;gap:6px;flex-wrap:wrap}
.cal-badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted)}
.cal-badge.ok{background:color-mix(in srgb,var(--start) 16%,transparent);color:var(--start)}
.cal-badge.half{background:color-mix(in srgb,var(--sign) 32%,transparent);color:var(--ink)}
.cal-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.ghost.sm{padding:5px 10px;font-size:12px;flex:none}
.ghost.danger{color:var(--end)}
.cal-steps{margin:0;padding-left:20px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.cal-gps{margin:0;font-size:14px;font-weight:500}
#cal-map svg{cursor:crosshair}
.cal-pin{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.cal-pin-t{fill:#fff;font-weight:800;font-family:var(--body)}
.cal-target circle{fill:none;stroke:var(--end);stroke-width:2.5}
.cal-target path{stroke:var(--end);stroke-width:2.5;stroke-linecap:round}
.cal-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cal-list:empty{display:none}
.cal-list li{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px}
.cal-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.cal-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.cal-txt b{font-size:14px}.cal-txt small{font-size:12px;color:var(--muted)}
.cal-out{display:flex;flex-direction:column;gap:8px}
.cal-out textarea{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical;min-width:0}
.cal-actions{display:flex;gap:8px;flex-wrap:wrap}
.cal-warn{color:var(--end);font-size:13px;margin:0}
.cal-warn:empty,#cal-msg:empty{display:none}
.gps-acc{fill:var(--muted);fill-opacity:.16;stroke:var(--muted);stroke-opacity:.5;stroke-width:1}
.gps-dot{fill:var(--muted);stroke:var(--surface);stroke-width:2}
.gpsbtn .fb{min-width:44px}

/* live navigation */
.go{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.navui{position:fixed;inset:0;z-index:60;background:var(--surface);display:flex;flex-direction:column}
.nv-in{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nv-top{background:var(--navy);color:var(--on-navy);padding-top:env(safe-area-inset-top,0px);border-radius:0 0 20px 20px;position:relative;z-index:2;box-shadow:0 6px 18px rgba(17,26,43,.18)}
.nv-row{display:flex;align-items:center;gap:12px;padding-block:14px 8px}
.nv-ico{width:60px;height:60px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.nv-ico.stair{background:var(--sign);color:var(--sign-ink)}.nv-ico.dest{background:var(--end)}
.nv-txt{flex:1;min-width:0}
.nv-main{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;line-height:1.15}
.nv-d{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nv-main small{font-size:18px;font-weight:700}
.nv-sub{font-size:14px;color:var(--on-navy-dim);margin-top:3px}
.nv-x{width:40px;height:40px;border-radius:12px;border:0;background:var(--navy-2);color:var(--on-navy);display:grid;place-items:center;flex:none;cursor:pointer;align-self:flex-start}
.nv-x[aria-pressed="true"]{background:var(--accent)}
.nv-nexttxt{font-size:13px;color:var(--on-navy-dim);padding-block:0 12px}
.nv-mapwrap{flex:1;position:relative;min-height:0;margin-top:-20px}
.nv-map{position:absolute;inset:0;overflow:auto;scrollbar-width:none;background:var(--surface);padding-top:20px}
.nv-map::-webkit-scrollbar{display:none}
.nv-map svg{display:block;max-width:none;height:auto;margin:60px 120px}
#nv-floor{position:absolute;top:32px;left:max(16px,env(safe-area-inset-left,0px));height:28px;font-size:13px;box-shadow:var(--shadow)}
.nv-chip{position:absolute;top:30px;right:max(16px,env(safe-area-inset-right,0px));border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:var(--shadow);cursor:pointer}
.nv-recenter{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.nv-bottom{background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(17,26,43,.1);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:2}
.nv-col{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.nv-rem{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nv-rem b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.nv-rem span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.nv-bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.nv-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}

/* ---------- graph ---------- */
const nodes=new Map(), adj=new Map();

const addEdge=(a,b,w)=>{adj.get(a).push([b,w]);adj.get(b).push([a,w]);};

const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function proj(p,[a,b]){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return [a[0]+t*dx,a[1]+t*dy];}

for(const k of KEYS){

  for(const p of places.filter(p=>p.k===k)){
    let best=null,bd=Infinity,bi=0;

function dijkstra(src){
  const d=new Map(),prev=new Map(),done=new Set();
  for(const k of nodes.keys())d.set(k,Infinity);d.set(src,0);
  for(;;){let u=null,b=Infinity;for(const[k,v]of d)if(v<b&&!done.has(k)){b=v;u=k;}
    if(u===null)break;done.add(u);
    for(const[v,w]of adj.get(u)){const nd=b+w;if(nd<d.get(v)){d.set(v,nd);prev.set(v,u);}}}
  return {d,prev};
}
function pathTo(prev,src,dst){const p=[dst];let c=dst;while(c!==src){c=prev.get(c);if(c===undefined)return null;p.unshift(c);}return p;}

/* ---------- search ---------- */
const norm=s=>s.replace(/[\s\-·()]/g,'').toLowerCase();
function search(q){
  let b=null,fl=null;q=q.trim();
  const mb=q.match(/^(본관|청솔관|청솔|후관)\s*(.*)$/);if(mb){b=mb[1]==='본관'?'M':'C';q=mb[2];}
  const m=q.match(/^([1-4])\s*층\s*(.*)$/);if(m){fl=+m[1];q=m[2];}
  const n=norm(q);if(!n&&!fl&&!b)return [];
  const pool=places.filter(p=>p.t!=='d'&&(!fl||p.f===fl)&&(!b||p.b===b));
  if(!n)return pool;
  const A=byId[fromId],cf=A?A.f:1,cb=A?A.b:'M';
  const scored=[];
  for(const p of pool){
    const keys=[p.n,...p.a].map(norm);
    let sc=0;
    if(keys[0]===n)sc=100;else if(keys[0].startsWith(n))sc=60;else if(keys[0].includes(n))sc=40;
    else if(keys.some(k=>k===n))sc=50;else if(keys.some(k=>k.includes(n)))sc=25;
    if(sc)scored.push([sc-Math.abs(p.f-cf)*.1-(p.b!==cb?.3:0)-p.f*.01,p]);
  }
  return scored.sort((a,b)=>b[0]-a[0]).slice(0,12).map(x=>x[1]);
}

/* ---------- GPS 좌표 맞추기 ---------- */
const GEO_ORIGIN={lat:34.9532107,lng:127.6976274}; // 구글 지도 기준 중마고 위치
const MLAT=111320,MLNG=111320*Math.cos(GEO_ORIGIN.lat*Math.PI/180);
const BAKED_CAL=null; // 현장에서 맞춘 보정값을 여기에 넣으면 모든 사람에게 적용돼요
const BBOX={M:[-100,-26,610,235],C:[0,0,400,135]};
const BRIDGE_Z={M:[527,-20],C:[250,-140]};
const cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]],csub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
const cdiv=(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d];};
const ll2w=(lat,lng)=>[(lng-GEO_ORIGIN.lng)*MLNG,(lat-GEO_ORIGIN.lat)*MLAT];
const tApply=(T,z)=>cadd(cmul(T.a,z),T.b);
let CAL={v:1,pts:[]};
try{const s=localStorage.getItem('jm-geo-cal');if(s){const c=JSON.parse(s);if(c&&Array.isArray(c.pts))CAL=c;}}catch(e){}
if(!CAL.pts.length&&BAKED_CAL)CAL=JSON.parse(JSON.stringify(BAKED_CAL));
const GEO={T:{},ready:{},info:{}};
function fitSim(prs){
  const n=prs.length;let zm=[0,0],wm=[0,0];
  prs.forEach(p=>{zm=cadd(zm,p.z);wm=cadd(wm,p.w);});zm=[zm[0]/n,zm[1]/n];wm=[wm[0]/n,wm[1]/n];
  let num=[0,0],den=0;
  prs.forEach(p=>{const dz=csub(p.z,zm),dw=csub(p.w,wm);num=cadd(num,cmul(dw,[dz[0],-dz[1]]));den+=dz[0]*dz[0]+dz[1]*dz[1];});
  if(den<1e-9)return null;
  const a=[num[0]/den,num[1]/den];return {a,b:csub(wm,cmul(a,zm))};
}
function computeGeo(){
  const s0=M_PER_UNIT,by={M:[],C:[]};
  CAL.pts.forEach(p=>{if(by[p.b])by[p.b].push(p);});
  const pr=p=>({z:[p.x,-p.y],w:ll2w(p.lat,p.lng)});
  const fit={},T={};
  const spread=b=>{let m=0;by[b].forEach(p=>by[b].forEach(q=>{m=Math.max(m,Math.hypot(p.x-q.x,p.y-q.y));}));return m;};
  ['M','C'].forEach(b=>{if(by[b].length>=2&&spread(b)>=150)fit[b]=fitSim(by[b].map(pr));});
  ['M','C'].forEach(b=>{
    if(fit[b]){T[b]=fit[b];return;}
    const o=b==='M'?'C':'M',a=fit[o]?fit[o].a:[s0,0];
    if(by[b].length>=1){const qs=by[b].map(pr),n=qs.length,zm=qs.reduce((s,q)=>cadd(s,q.z),[0,0]),wm=qs.reduce((s,q)=>cadd(s,q.w),[0,0]);T[b]={a,b:csub([wm[0]/n,wm[1]/n],cmul(a,[zm[0]/n,zm[1]/n]))};}
  });
  if(!T.M&&!T.C)T.M={a:[s0,0],b:csub([0,0],cmul([s0,0],[260,-105]))};
  if(!T.C){const wp=cadd(tApply(T.M,BRIDGE_Z.M),cmul(T.M.a,[0,110]));T.C={a:T.M.a,b:csub(wp,cmul(T.M.a,BRIDGE_Z.C))};}
  if(!T.M){const wp=csub(tApply(T.C,BRIDGE_Z.C),cmul(T.C.a,[0,110]));T.M={a:T.C.a,b:csub(wp,cmul(T.C.a,BRIDGE_Z.M))};}
  GEO.T=T;
  ['M','C'].forEach(b=>{
    const n=by[b].length,res=by[b].map(p=>{const q=pr(p),d=csub(tApply(T[b],q.z),q.w);return Math.hypot(d[0],d[1]);});
    GEO.ready[b]=n>=1;
    GEO.info[b]={full:!!fit[b],close:n>=2&&!fit[b],spreadM:Math.round(spread(b)*M_PER_UNIT),n,res,rms:n>=3?Math.sqrt(res.reduce((s,r)=>s+r*r,0)/n):null,ratio:Math.hypot(...T[b].a)/s0,deg:Math.atan2(T[b].a[1],T[b].a[0])*180/Math.PI};
  });
}
computeGeo();
const scaleOf=b=>Math.hypot(...GEO.T[b].a);
function ll2map(b,lat,lng){const z=cdiv(csub(ll2w(lat,lng),GEO.T[b].b),GEO.T[b].a);return [z[0],-z[1]];}
function nearestPlace(k,x,y){
  let best=null;
  places.forEach(p=>{if(p.k!==k||p.t==='d')return;const r=p.r,d=Math.hypot(Math.max(r[0]-x,0,x-r[2]),Math.max(r[1]-y,0,y-r[3]))+Math.hypot(p.cx-x,p.cy-y)*0.01;if(!best||d<best.d)best={p,d};});
  return best&&best.p;
}

/* GPS 수신 */
const GPS={id:null,last:null,err:null,subs:new Set()};
const FRAMED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
const gpsPossible=()=>!!(navigator.geolocation&&window.isSecureContext);
function gpsSub(fn){
  GPS.subs.add(fn);
  if(!gpsPossible()){setTimeout(()=>fn(null,{code:0}),0);}
  else if(GPS.id==null){
    try{GPS.id=navigator.geolocation.watchPosition(
      p=>{GPS.err=null;GPS.last={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};GPS.subs.forEach(f=>f(GPS.last,null));},
      e=>{GPS.err=e;GPS.subs.forEach(f=>f(null,e));},
      {enableHighAccuracy:true,maximumAge:1000,timeout:20000});}
    catch(e){GPS.err={code:0};setTimeout(()=>fn(null,GPS.err),0);}
  }
  return ()=>{GPS.subs.delete(fn);if(!GPS.subs.size&&GPS.id!=null){try{navigator.geolocation.clearWatch(GPS.id);}catch(e){}GPS.id=null;}};
}
function gpsErrMsg(e){
  if(!gpsPossible()||!e||e.code===0||(FRAMED&&e.code===1))return '이 화면에서는 GPS를 쓸 수 없어요. 학교 사이트 주소(https)로 열어야 해요.';
  if(e.code===1)return '위치 권한이 꺼져 있어요. 브라우저 설정에서 이 사이트의 위치 권한을 허용해 주세요.';
  if(e.code===2)return 'GPS 신호를 못 잡았어요. 창가나 건물 밖에서 다시 해보세요.';
  return '위치를 찾는 데 오래 걸려요. 잠시 후 다시 해보세요.';
}
function locateMe(ul,pick){
  const msg=t=>{ul.innerHTML=`<li class="cap">${t}</li>`;ul.hidden=false;};
  if(!GEO.ready.M&&!GEO.ready.C){msg('아직 GPS 위치 맞추기를 안 했어요. 아래 QR·GPS 탭에서 먼저 맞춰 주세요.');return;}
  if(!gpsPossible()){msg(gpsErrMsg({code:0}));return;}
  msg('GPS로 위치 찾는 중…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const f={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
    let best=null;
    ['M','C'].forEach(b=>{if(!GEO.ready[b])return;const [x,y]=ll2map(b,f.lat,f.lng),bb=BBOX[b];
      const dm=Math.hypot(Math.max(bb[0]-x,0,x-bb[2]),Math.max(bb[1]-y,0,y-bb[3]))*scaleOf(b);if(!best||dm<best.dm)best={b,x,y,dm};});
    if(!best||best.dm>Math.max(40,f.acc)){msg(`학교 건물에서 떨어져 있거나 GPS가 부정확해요 (±${Math.round(f.acc)}m)`);return;}
    ul.innerHTML=`<li class="cap">${BLD[best.b].name} 근처예요 (±${Math.round(f.acc)}m). 지금 몇 층이에요?</li><li><div class="floors">${[1,2,3,4].map(n=>`<button type="button" class="f${n}" data-lf="${n}">${n}층</button>`).join('')}</div></li>`;
    ul.hidden=false;
    ul.querySelectorAll('[data-lf]').forEach(bt=>bt.onclick=e=>{e.stopPropagation();const p=nearestPlace(best.b+bt.dataset.lf,best.x,best.y);if(p)pick(p.id);});

/* ---------- 경로 계산 ---------- */
function computeRoute(fid,tid){
  const src='P:'+fid,{d,prev}=dijkstra(src);
  let dest=tid;
  if(tid===NEAR_WC){let b=Infinity;for(const p of places)if(p.t==='w'&&d.get('P:'+p.id)<b){b=d.get('P:'+p.id);dest=p.id;}}
  if(dest===fid)return {err:'same'};
  const path=pathTo(prev,src,'P:'+dest);if(!path)return {err:'none'};
  const A=byId[fid],B=byId[dest];
  const runs=[];let cur={type:'walk',k:A.k,d:0,pts:[[A.cx,A.cy]]};let floors=0;
  for(let i=0;i<path.length-1;i++){
    const a=nodes.get(path[i]),b=nodes.get(path[i+1]);
    if(a.k!==b.k&&a.stair&&b.stair){
      floors++;
      if(cur.type==='walk'){runs.push(cur);cur={type:'stair',st:a.stair,from:+a.k[1],to:+b.k[1]};}else cur.to=+b.k[1];
    }else if(a.k!==b.k){
      cur.pts.push(outOf(a.k));runs.push(cur);
      runs.push({type:'bridge',fromK:a.k,toK:b.k});
      cur={type:'walk',k:b.k,d:BRIDGE.len,pts:[outOf(b.k),[b.x,b.y]]};
    }else{
      if(cur.type==='stair'){runs.push(cur);cur={type:'walk',k:b.k,d:0,pts:[[a.x,a.y]]};}
      cur.d+=Math.hypot(a.x-b.x,a.y-b.y);cur.pts.push([b.x,b.y]);
    }
  }
  runs.push(cur);
  const total=d.get('P:'+dest)*M_PER_UNIT;
  const secs=(total-floors*STAIR_COST*M_PER_UNIT)/1.4+floors*12;
  const steps=[{c:'s',i:'출',t:`<b>${lab(A)}</b>에서 출발`}];
  runs.forEach((r,k)=>{
    if(r.type==='walk'){
      const next=runs[k+1],prevR=runs[k-1];
      let m=r.d;if(prevR&&prevR.type==='bridge')m-=BRIDGE.len;
      m=Math.max(1,Math.round(m*M_PER_UNIT));
      const fb=badge(r.k)+' ';
      if(next&&next.type==='stair')steps.push({c:'',i:'→',t:`${fb}복도를 따라 약 ${m}m 걸어 <b>${next.st.n}</b>으로`});
      else if(next)steps.push({c:'',i:'→',t:r.k==='C2'?`${fb}복도를 따라 약 ${m}m 걸어 <b>라운지</b>로 들어가서 안쪽 연결통로로`:`${fb}복도를 따라 약 ${m}m 걸어 <b>복도 끝 연결통로</b>로`});
      else if(prevR&&prevR.type==='bridge'&&r.k==='C2'&&B.n==='라운지')steps.push({c:'',i:'→',t:`${fb}연결통로를 나오면 바로 라운지예요`});
      else steps.push({c:'',i:'→',t:`${fb}${prevR&&prevR.type==='bridge'&&r.k==='C2'?'라운지를 지나 ':k?'도착 층에서 ':''}복도를 따라 약 ${m}m 걸어가기`});
    }else if(r.type==='stair'){
      steps.push({c:'st',i:r.to>r.from?'▲':'▼',t:`${r.st.n}으로 <b>${r.from}층 → ${r.to}층</b> ${r.to>r.from?'올라가기':'내려가기'} <span style="color:var(--muted)">(${Math.abs(r.to-r.from)}개 층)</span>`});
    }else{
      steps.push({c:'st',i:'⇢',t:`연결통로로 <b>${kname(r.fromK)} → ${kname(r.toK)}</b> 건너가기 <span style="color:var(--muted)">(약 ${Math.round(BRIDGE.len*M_PER_UNIT)}m)</span>`});
    }
  });
  steps.push({c:'e',i:'도',t:`<b>${lab(B)}</b> 도착`});
  return {A,B,runs,total,secs,floors,steps};
}

function centerOn(x,y,smooth){

/* ---------- 내 위치 (GPS) ---------- */
function detectBuilding(f){
  let best=null;
  ['M','C'].forEach(b=>{if(!GEO.ready[b])return;const [x,y]=ll2map(b,f.lat,f.lng),bb=BBOX[b];
    const dm=Math.hypot(Math.max(bb[0]-x,0,x-bb[2]),Math.max(bb[1]-y,0,y-bb[3]))*scaleOf(b);if(!best||dm<best.dm)best={b,x,y,dm};});
  return best&&best.dm<=Math.max(40,f.acc)?best:null;
}
function locate(){
  if(!gpsPossible()){gpsState='err';gpsMsg=gpsErrMsg({code:0});renderSheet();return;}
  if(!GEO.ready.M&&!GEO.ready.C){gpsState='err';gpsMsg='아직 GPS 준비 중이라 내 위치를 찾을 수 없어요. 바꾸기를 눌러 출발지를 골라 주세요.';renderSheet();return;}
  if(gpsState!=='ok'){gpsState='locating';if(mode==='idle')renderSheet();}
  follow=true;
  if(!idleUnsub)idleUnsub=gpsSub(onIdleFix);
  else if(GPS.last)onIdleFix(GPS.last,null);
}
function onIdleFix(f,e){
  if(e){if(!myFix||gpsState!=='ok'){gpsState='err';gpsMsg=gpsErrMsg(e);if(mode==='idle')renderSheet();}return;}
  myFix=f;
  const det=detectBuilding(f);
  if(!det){myXY=null;if(gpsState!=='ok'){gpsState='err';gpsMsg=`학교 건물에서 떨어져 있거나 GPS가 부정확해요 (±${Math.round(f.acc)}m)`;if(mode==='idle')renderSheet();}updateMeDot();return;}
  const changed=myB!==det.b,first=gpsState!=='ok';
  myB=det.b;myXY=[det.x,det.y];gpsState='ok';
  if(changed){myFloor=null;askFloor();}
  else if(first&&fromKind!=='qr'&&!myFloor)askFloor();
  if(updateFromGps()&&mode==='preview')refreshRoute(false);
  if(first||changed){if(mode==='idle')renderSheet();renderFloorSel();}
  else if(mode==='idle'&&fromKind==='gps'){const s=$('me-sub');if(s)s.textContent=meSub();}
  updateMeDot();if(follow)centerOnMe(true);
}
function updateFromGps(){
  if(fromKind!=='gps'||!myB||!myFloor||!myXY)return false;
  const p=nearestPlace(myB+myFloor,myXY[0],myXY[1]);
  if(p&&p.id!==fromId){fromId=p.id;return true;}return false;
}
function askFloor(){
  if(asking||!myB)return;asking=true;

function fitLabel(p){
  const [x1,y1,x2,y2]=p.r,w=x2-x1,h=y2-y1,txt=p.s||p.n,len=[...txt].length;
  let fs=Math.min(11,(w-4)/(len*1.02));
  if(fs<7&&h>w*1.3){const v=Math.min(10,(h-6)/(len*1.05));return `<text class="lbl" x="${p.cx}" y="${p.cy}" font-size="${Math.max(v,5).toFixed(1)}" style="writing-mode:vertical-rl;text-orientation:upright">${txt}</text>`;}
  return `<text class="lbl" x="${p.cx}" y="${p.cy}" font-size="${Math.max(fs,5.5).toFixed(1)}">${txt}</text>`;
}
function floorSVG(k,o={}){
  const B=BLD[k[0]],F=FLOORS[k];let s=`<svg viewBox="${B.vb.join(' ')}" role="img" aria-label="${kname(k)} 안내도" style="width:max(100%,${B.minw}px)">`;

  for(const[a,b,c,d]of(F.deco||[]))s+=`<rect class="room t-d" x="${a}" y="${b}" width="${c-a}" height="${d-b}"/>`;
  for(const st of B.stairs){

    if((d-b)>(c-a))for(let y=b+6;y<d;y+=6)s+=`<line class="hatch" x1="${a}" y1="${y}" x2="${c}" y2="${y}"/>`;
    else for(let x=a+5;x<c;x+=5)s+=`<line class="hatch" x1="${x}" y1="${b}" x2="${x}" y2="${d}"/>`;
  }
  for(const p of places.filter(p=>p.k===k)){
    const[a,b,c,d]=p.r;

}

/* ---------- 실시간 안내 ---------- */
const STAIR_M_PER_FLOOR=12, STEP_M=0.72, WALK_MPS=1.4;
const NAV={on:false,mode:'time',voice:false};
try{NAV.voice=localStorage.getItem('jm-voice')==='1';}catch(e){}
const NI={
  left:'<path d="M18 20v-7a4 4 0 0 0-4-4H5"/><path d="M9 5 5 9l4 4"/>',
  right:'<path d="M6 20v-7a4 4 0 0 1 4-4h9"/><path d="m15 5 4 4-4 4"/>',
  straight:'<path d="M12 20V4"/><path d="m6 10 6-6 6 6"/>',
  up:'<path d="M3 20h5v-5h5v-5h5V5h3"/>',
  down:'<path d="M3 5h3v5h5v5h5v5h5"/>',
  bridge:'<path d="M3 12h15"/><path d="m13 6 6 6-6 6"/><path d="M3 7h3M3 17h3"/>',
  dest:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>'
};
const nico=k=>`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${NI[k]}</svg>`;

function simplify(pts){
  const out=[];
  for(const p of pts){if(out.length&&dist(out[out.length-1],p)<0.5)continue;out.push(p);}
  for(let i=out.length-2;i>0;i--){
    const a=out[i-1],b=out[i],c=out[i+1],ux=b[0]-a[0],uy=b[1]-a[1],vx=c[0]-b[0],vy=c[1]-b[1];
    const cr=(ux*vy-uy*vx)/(Math.hypot(ux,uy)*Math.hypot(vx,vy)),dt=ux*vx+uy*vy;
    if(Math.abs(cr)<0.05&&dt>0)out.splice(i,1);
  }
  return out;
}
function buildPlan(R){
  const legs=[];
  R.runs.forEach((r,i)=>{
    const next=R.runs[i+1];
    if(r.type==='walk'){
      const pts=simplify(r.pts),cum=[0];
      for(let j=1;j<pts.length;j++)cum.push(cum[j-1]+dist(pts[j-1],pts[j])*M_PER_UNIT);
      const man=[];
      for(let j=1;j<pts.length-1;j++){
        const a=pts[j-1],b=pts[j],c=pts[j+1],ux=b[0]-a[0],uy=b[1]-a[1],vx=c[0]-b[0],vy=c[1]-b[1];
        const cr=(ux*vy-uy*vx)/(Math.hypot(ux,uy)*Math.hypot(vx,vy));
        if(Math.abs(cr)<0.3)continue;
        man.push({at:cum[j],kind:cr>0?'right':'left',exit:i===0&&j===1,j});
      }
      const end={at:cum[cum.length-1],kind:!next?'dest':next.type==='stair'?(next.to>next.from?'up':'down'):'bridge',next};
      const lastTurn=man[man.length-1];
      if(lastTurn&&lastTurn.j===pts.length-2&&end.at-lastTurn.at<5){end.side=lastTurn.kind;man.pop();}
      man.push(end);
      legs.push({type:'walk',k:r.k,pts,cum,len:cum[cum.length-1],man});
    }else if(r.type==='stair'){
      legs.push({type:'stair',st:r.st,from:r.from,to:r.to,len:Math.abs(r.to-r.from)*STAIR_M_PER_FLOOR,nextK:next.k,nextPts:simplify(next.pts)});
    }else{
      legs.push({type:'bridge',fromK:r.fromK,toK:r.toK,len:BRIDGE.len*M_PER_UNIT,nextK:next.k,nextPts:simplify(next.pts)});
    }
  });
  let s=0;const items=[];
  legs.forEach((l,i)=>{l.start=s;
    if(l.type==='walk')l.man.forEach(m=>items.push({...m,g:s+m.at,leg:i}));
    else items.push({kind:l.type==='stair'?'arrive-floor':'arrive-bldg',g:s+l.len,leg:i,L:l});
    s+=l.len;});
  return {legs,items,total:s};
}
function manInfo(m,d){
  const D=d>=4?`${Math.round(d)}미터 앞`:'';
  const sideW=m.side==='left'?'왼쪽':m.side==='right'?'오른쪽':'';
  switch(m.kind){
    case 'left':case 'right':{const w=m.kind==='left'?'왼쪽':'오른쪽';
      return {ico:m.kind,t:`${w}으로`,sub:m.exit?`방에서 나와 ${w}으로 가요`:`복도를 따라 ${w}으로 꺾어요`,say:m.exit?`방에서 나와 ${w}으로 가세요`:`${D?D+'에서 ':''}${w}으로 도세요`};}
    case 'up':case 'down':{const n=m.next,ud=m.kind==='up'?'올라가':'내려가';
      return {ico:m.kind,t:`${sideW?sideW+' ':''}계단`,sub:`${n.st.n}으로 ${n.to}층까지 ${ud}요`,say:`${D?D+' ':''}${sideW?sideW+' ':''}${n.st.n}으로 ${n.to}층까지 ${ud}세요`};}
    case 'bridge':return {ico:'bridge',t:'연결통로',sub:`${kname(m.next.toK)}으로 건너가요`,say:`${D?D+' ':''}연결통로로 ${kname(m.next.toK)}으로 건너가세요`};
    case 'dest':return {ico:'dest',t:sideW?`${sideW}에 목적지`:'목적지',sub:lab(NAV.B),say:`${D?D+' ':''}${sideW?sideW+'에 ':''}목적지가 있습니다`};
    case 'arrive-floor':{const L=m.L;return {ico:L.to>L.from?'up':'down',t:`${L.to}층 도착`,sub:`${L.st.n}으로 계속 ${L.to>L.from?'올라가요':'내려가요'}`,say:''};}
    default:return {ico:'bridge',t:`${kname(m.L.toK)} 도착`,sub:'연결통로를 따라 직진해요',say:''};
  }
}
function pointAt(L,u){
  let j=1;while(j<L.cum.length-1&&L.cum[j]<u)j++;
  const a=L.pts[j-1],b=L.pts[j],seg=(L.cum[j]-L.cum[j-1])||1,t=Math.min(1,Math.max(0,(u-L.cum[j-1])/seg));
  return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,ang:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI,j};
}

/* ---------- 걸음·방향 감지 (실내 내비) ---------- */
const STEPS_PER_FLOOR=22;
const SENS={fast:9.8,slow:9.8,armed:true,last:0,ok:false,bound:false};
const HEAD={ok:false,bound:false,h:null,ref:null};
const angDiff=(a,b)=>((a-b+540)%360)-180;
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
  if(!SENS.ok){SENS.ok=true;if(NAV.on&&NAV.mode==='time'&&NAV.playing)NAV.mode='pdr';}
  const m=Math.hypot(a.x,a.y,a.z),now=performance.now();
  SENS.fast=SENS.fast*0.7+m*0.3;SENS.slow=SENS.slow*0.98+m*0.02;
  const diff=SENS.fast-SENS.slow;
  if(SENS.armed&&diff>1.1&&now-SENS.last>300){SENS.armed=false;SENS.last=now;onStep();}
  if(diff<0.3)SENS.armed=true;
}
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading))h=e.webkitCompassHeading;
  else if(e.alpha!=null)h=360-e.alpha;
  if(h==null||isNaN(h))return;
  HEAD.ok=true;
  HEAD.h=HEAD.h==null?h:(HEAD.h+angDiff(h,HEAD.h)*0.3+360)%360;
  onHeading();
}
function startSensors(){
  // 리스너는 바로 붙이고(안드로이드), 아이폰처럼 권한을 물어야 하는 곳은 따로 요청
  if(!SENS.bound){window.addEventListener('devicemotion',onMotion);SENS.bound=true;}
  if(!HEAD.bound){window.addEventListener('deviceorientation',onOrient);HEAD.bound=true;}
  try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')DeviceMotionEvent.requestPermission().catch(()=>{});}catch(e){}
  try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')DeviceOrientationEvent.requestPermission().catch(()=>{});}catch(e){}
}
function legAt(s){const P=NAV.plan;let i=P.legs.findIndex(l=>s<l.start+l.len-1e-6);if(i<0)i=P.legs.length-1;return {L:P.legs[i],i};}
const isTurn=m=>m.kind==='left'||m.kind==='right'||!!m.side;
function nextTurn(i){return NAV.plan.items.find(m=>m.leg===i&&isTurn(m)&&m.g>=NAV.target-0.3&&!NAV.passed.has(m));}
/* 걸음마다 경로를 따라 앞으로. 꺾는 곳에서는 몸을 돌릴 때까지 조금만 지나치게 함 */
function onStep(){
  if(!NAV.on||!NAV.playing||NAV.arrived)return;
  NAV.steps++;
  if(NAV.mode!=='pdr')return;
  const {L,i}=legAt(NAV.target);
  let nt=NAV.target+(L.type==='stair'?STAIR_M_PER_FLOOR/STEPS_PER_FLOOR:STEP_M);
  if(L.type==='walk'&&HEAD.ok){
    const m=nextTurn(i);
    if(m){const lim=m.g+(m.side?-0.01:2);
      if(nt>lim){if(++NAV.clampSteps>8){NAV.passed.add(m);NAV.clampSteps=0;}else nt=Math.max(NAV.target,lim);}}
  }
  NAV.target=Math.min(NAV.plan.total,nt);
}
/* 몸을 크게 돌리면(55° 이상) 근처 갈림길을 지난 걸로 보고 위치를 갈림길에 맞춤 */
function onHeading(){
  if(!NAV.on||NAV.mode!=='pdr'||NAV.arrived)return;
  const {L,i}=legAt(NAV.target);
  if(L.type!=='walk'){HEAD.ref=HEAD.h;return;}
  if(HEAD.ref==null){HEAD.ref=HEAD.h;return;}
  const d=angDiff(HEAD.h,HEAD.ref);
  if(Math.abs(d)<25){HEAD.ref=(HEAD.ref+d*0.03+360)%360;return;}
  if(Math.abs(d)<55)return;
  const dir=d>0?'right':'left';
  const m=NAV.plan.items.find(x=>x.leg===i&&(x.kind===dir||x.side===dir)&&x.g>=NAV.target-6&&x.g<=NAV.target+12&&!NAV.passed.has(x));
  if(m){NAV.passed.add(m);NAV.target=Math.max(NAV.target,m.side?m.g:m.g+0.5);NAV.clampSteps=0;}
  HEAD.ref=HEAD.h;
}
/* GPS는 보조: 정확도 12m 이내인데 15m 넘게 어긋난 게 4번 연속일 때만 바로잡음 */
function onNavFix(f,e){
  if(!NAV.on)return;
  if(e){if(e.code===0||e.code===1)NAV.gpsDenied=true;return;}
  if(NAV.arrived||!NAV.playing||f.acc>12)return;
  const {L}=legAt(NAV.target);if(L.type!=='walk')return;
  const b=L.k[0];if(!GEO.ready[b])return;
  const [x,y]=ll2map(b,f.lat,f.lng),sc=scaleOf(b);
  let best=null;
  for(let j=1;j<L.pts.length;j++){const a=L.pts[j-1],q=proj([x,y],[a,L.pts[j]]),dp=dist(q,[x,y])*sc;
    if(dp>f.acc+8)continue;const along=L.cum[j-1]+dist(a,q)*M_PER_UNIT;if(!best||dp<best.dp)best={dp,along};}
  if(!best){NAV.gpsOff=0;return;}
  const sg=L.start+best.along;
  if(Math.abs(sg-NAV.target)>15){if(++NAV.gpsOff>=4){NAV.target=sg;NAV.s=sg;NAV.gpsOff=0;}}else NAV.gpsOff=0;
}
function modeText(){
  if(NAV.mode==='time')return NAV.playing?'센서 없음 · 걷는 속도로 자동 이동':'멈춤 · 누르면 계속';
  if(!SENS.ok)return '걸음 센서 확인 중…';
  return `걸음 ${NAV.steps}${HEAD.ok?' · 방향 감지':''}`;
}
function say(t){
  if(!NAV.voice||!t)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1.05;speechSynthesis.speak(u);}catch(e){}
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

function startNav(){
  if(!lastRoute)return;
  startSensors();
  NAV.plan=buildPlan(lastRoute);NAV.A=lastRoute.A;NAV.B=lastRoute.B;
  Object.assign(NAV,{on:true,s:0,target:0,playing:true,curK:null,lastT:0,cur:-1,steps:0,arrived:false,freeUntil:0,mode:'pdr',uiKey:'',gpsDenied:false,gpsOff:0,clampSteps:0,passed:new Set(),lastLeg:-1,t0:performance.now()});
  HEAD.ref=HEAD.h;
  if(NAV.gpsUnsub){NAV.gpsUnsub();NAV.gpsUnsub=null;}
  if(gpsPossible()&&(GEO.ready.M||GEO.ready.C))NAV.gpsUnsub=gpsSub(onNavFix);
  $('navui').hidden=false;document.body.style.overflow='hidden';
  $('nv-run').hidden=false;$('nv-done').hidden=true;
  $('nv-voice').setAttribute('aria-pressed',NAV.voice);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{NAV.lock=l;}).catch(()=>{});}catch(e){}
  requestAnimationFrame(navTick);
}
function stopNav(){
  NAV.on=false;$('navui').hidden=true;document.body.style.overflow='';
  if(NAV.gpsUnsub){NAV.gpsUnsub();NAV.gpsUnsub=null;}
  try{speechSynthesis.cancel();}catch(e){}
  try{NAV.lock&&NAV.lock.release();}catch(e){}NAV.lock=null;
  if(typeof onNavClosed==='function')onNavClosed();
}
function navTick(t){
  if(!NAV.on)return;
  const dt=NAV.lastT?Math.min(0.1,(t-NAV.lastT)/1000):0;NAV.lastT=t;
  if(NAV.playing&&!NAV.arrived){
    if(NAV.mode==='pdr'&&!SENS.ok&&t-NAV.t0>2500)NAV.mode='time';
    if(NAV.mode==='time')NAV.target=Math.min(NAV.plan.total,NAV.target+dt*WALK_MPS);
  }
  NAV.s+=(NAV.target-NAV.s)*Math.min(1,dt*5);
  if(Math.abs(NAV.target-NAV.s)<0.02)NAV.s=NAV.target;
  drawNav();
  requestAnimationFrame(navTick);
}
function navMap(key){
  const P=NAV.plan;
  const o={lines:P.legs.filter(l=>l.type==='walk'&&l.k===key).map(l=>l.pts),
    stairs:new Set(P.legs.filter(l=>l.type==='stair').map(l=>l.st.id)),
    end:NAV.B.k===key?NAV.B.id:null,endPt:NAV.B.k===key?[NAV.B.cx,NAV.B.cy]:null};
  $('nv-map').innerHTML=floorSVG(key,o).replace(/<\/svg>$/,'<polyline class="path-done" id="nv-trail" points=""/><g id="nv-me"><circle class="me-halo" r="18"/><path class="me-dir" id="nv-dir" d="M19 0 9 -7 9 7Z"/><circle class="me-dot" r="7.5"/></g></svg>');
  const svg=$('nv-map').querySelector('svg');svg.style.width=(key[0]==='M'?1150:720)+'px';
  $('nv-floor').className='fb f'+key[1];$('nv-floor').textContent=kname(key);
  NAV.curK=key;NAV.freeUntil=0;
}
function center(x,y){
  if(performance.now()<NAV.freeUntil)return;
  const box=$('nv-map'),svg=box.querySelector('svg');if(!svg)return;
  const vb=BLD[NAV.curK[0]].vb,sc=svg.clientWidth/vb[2];
  const br=box.getBoundingClientRect(),sr=svg.getBoundingClientRect();
  box.scrollLeft=(x-vb[0])*sc+sr.left-br.left+box.scrollLeft-box.clientWidth/2;box.scrollTop=(y-vb[1])*sc+sr.top-br.top+box.scrollTop-box.clientHeight/2;
}
const fmtSec=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60);return m?`${m}분 ${s%60}초`:`${s}초`;};
function drawNav(){
  const P=NAV.plan,s=NAV.s;
  let li=P.legs.findIndex(l=>s<l.start+l.len-1e-6);if(li<0)li=P.legs.length-1;
  const L=P.legs[li],loc=s-L.start;
  if(li!==NAV.lastLeg){NAV.lastLeg=li;HEAD.ref=HEAD.h;NAV.clampSteps=0;}
  const key=L.type==='walk'?L.k:L.nextK;
  if(NAV.curK!==key)navMap(key);
  let pos,waiting=false;
  if(L.type==='walk')pos=pointAt(L,loc);
  else{const p=L.nextPts;pos={x:p[0][0],y:p[0][1],ang:Math.atan2(p[1][1]-p[0][1],p[1][0]-p[0][0])*180/Math.PI};waiting=true;}
  const me=$('nv-me');me.setAttribute('transform',`translate(${pos.x.toFixed(1)} ${pos.y.toFixed(1)})`);me.classList.toggle('wait',waiting);
  $('nv-dir').setAttribute('transform',`rotate(${pos.ang.toFixed(1)})`);
  const ft=kname(key)+(L.type==='walk'?'':' · 미리보기');if($('nv-floor').textContent!==ft)$('nv-floor').textContent=ft;
  // 지나간 길은 회색으로 덮음
  $('nv-trail').setAttribute('points',L.type==='walk'?[...L.pts.slice(0,pos.j),[pos.x,pos.y]].map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '):'');
  center(pos.x,pos.y);
  let ci=P.items.findIndex(m=>m.g>s+0.15||(m.leg===li&&L.type==='walk'&&m.g>=L.start+L.len-1e-6));
  if(ci<0)ci=P.items.length-1;
  const m=P.items[ci],d=Math.max(0,m.g-s),info=manInfo(m,d);
  let main,sub=info.sub,ico=info.ico;
  if(L.type==='stair'){
    const up=L.to>L.from,fl=L.from+Math.round((L.to-L.from)*Math.min(1,loc/L.len));
    main=`<span class="nv-d">${L.to}층까지</span><small>${up?'올라가세요':'내려가세요'}</small>`;
    sub=`${L.st.n} · 지금 약 ${fl}층`;ico=up?'up':'down';
  }else if(L.type==='bridge'){
    main=`<span class="nv-d">${Math.ceil(d)}m</span><small>연결통로 직진</small>`;sub=`${kname(L.toK)}으로 건너가요`;
  }else main=d>=2.5?`<span class="nv-d">${Math.round(d)}m</span><small>${info.t}</small>`:`<span class="nv-d">${info.t}</span>`;
  // '그 다음'은 다음 안내가 10m 안에 바로 이어질 때만
  const nx=P.items[ci+1];
  let nextTxt='';
  if(nx&&nx.g-m.g<=10){const ni=manInfo(nx,nx.g-m.g);nextTxt=`그 다음 · ${ni.t}${nx.kind==='up'||nx.kind==='down'?` (${nx.next.to}층)`:''}`;}
  const uiKey=main+sub+ico+nextTxt;
  if(uiKey!==NAV.uiKey){
    NAV.uiKey=uiKey;
    $('nv-ico').innerHTML=nico(ico);$('nv-ico').className='nv-ico '+(ico==='dest'?'dest':ico==='up'||ico==='down'?'stair':'');
    $('nv-main').innerHTML=main;$('nv-sub').textContent=sub;$('nv-nexttxt').textContent=nextTxt;
  }
  if(ci!==NAV.cur){
    if(NAV.cur>=0)buzz(60);
    NAV.cur=ci;
    if(L.type==='stair')say(`${L.st.n}으로 ${L.to}층까지 ${L.to>L.from?'올라가세요':'내려가세요'}`);
    else say(info.say);
  }
  const rem=Math.max(0,P.total-s),eta=new Date(Date.now()+rem/WALK_MPS*1000);
  $('nv-time').textContent=fmtSec(rem/WALK_MPS);
  $('nv-dist').textContent=`${Math.round(rem)}m · ${String(eta.getHours()).padStart(2,'0')}:${String(eta.getMinutes()).padStart(2,'0')} 도착`;
  $('nv-prog').style.width=(P.total?s/P.total*100:100).toFixed(1)+'%';
  const cf=$('nv-confirm'),showCf=L.type==='stair';
  if(cf.hidden===showCf)cf.hidden=!showCf;
  if(showCf){const t=`${L.to}층에 도착했어요`;if(cf.textContent!==t)cf.textContent=t;}
  const mt=modeText();if($('nv-mode').textContent!==mt)$('nv-mode').textContent=mt;
  if(!NAV.arrived&&s>=P.total-0.05){
    NAV.arrived=true;NAV.playing=false;buzz([80,60,80]);say('목적지에 도착했습니다. 안내를 종료합니다');
    $('nv-arrived-name').textContent=lab(NAV.B);$('nv-run').hidden=true;$('nv-done').hidden=false;
  }
}
/* 지도에서 내 위치를 꾹 누르면 그 자리(경로 위 가장 가까운 곳)로 옮김 */
function placeAt(cx,cy){
  const svg=$('nv-map').querySelector('svg');if(!svg||!NAV.on)return;
  const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  let best=null;
  NAV.plan.legs.forEach(L=>{if(L.type!=='walk'||L.k!==NAV.curK)return;
    for(let j=1;j<L.pts.length;j++){const q=proj([p.x,p.y],[L.pts[j-1],L.pts[j]]),dd=dist(q,[p.x,p.y]);if(!best||dd<best.d)best={d:dd,g:L.start+L.cum[j-1]+dist(L.pts[j-1],q)*M_PER_UNIT};}});
  if(!best||best.d>60){toast('파란 경로 근처를 꾹 눌러 주세요');return;}
  NAV.passed=new Set(NAV.plan.items.filter(m=>m.g<=best.g+0.01));
  NAV.target=best.g;NAV.s=best.g;NAV.arrived=false;NAV.clampSteps=0;NAV.freeUntil=0;HEAD.ref=HEAD.h;
  $('nv-run').hidden=false;$('nv-done').hidden=true;
  buzz(40);toast('내 위치를 옮겼어요');
}
(function(){
  const map=$('nv-map');let tm=null,sx=0,sy=0;
  map.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;clearTimeout(tm);tm=setTimeout(()=>{tm=null;placeAt(sx,sy);},600);});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>map.addEventListener(ev,()=>{clearTimeout(tm);tm=null;}));
  map.addEventListener('pointermove',e=>{if(tm&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){clearTimeout(tm);tm=null;}});
  map.addEventListener('contextmenu',e=>e.preventDefault());
})();
$('nv-close').onclick=stopNav;$('nv-finish').onclick=stopNav;
$('nv-confirm').onclick=()=>{const {L}=legAt(NAV.target);if(L.type==='stair'){NAV.target=L.start+L.len;NAV.freeUntil=0;}};
$('nv-mode').onclick=()=>{if(NAV.mode==='time')NAV.playing=!NAV.playing;};
$('nv-recenter').onclick=()=>{NAV.freeUntil=0;};
$('nv-voice').onclick=()=>{NAV.voice=!NAV.voice;$('nv-voice').setAttribute('aria-pressed',NAV.voice);try{localStorage.setItem('jm-voice',NAV.voice?'1':'0');}catch(e){}
  if(NAV.voice){NAV.cur=-1;}else{try{speechSynthesis.cancel();}catch(e){}}};
['pointerdown','wheel','touchstart'].forEach(ev=>$('nv-map').addEventListener(ev,()=>{NAV.freeUntil=performance.now()+5000;},{passive:true}));


/* ---------- 시작 ---------- */
(function(){
  const hashId=(location.hash||'').slice(1);
  if(byId[hashId]){const p=byId[hashId];fromId=p.id;fromKind='qr';myB=p.b;myFloor=p.f;viewK=p.k;}
  else{fromId=central.id;fromKind='default';viewK=central.k;}
  renderAll(false);requestAnimationFrame(()=>requestAnimationFrame(centerDefault));
  if(!gpsPossible()){gpsState='err';gpsMsg=gpsErrMsg({code:0});renderSheet();}
  else if(GEO.ready.M||GEO.ready.C)locate();
})();
</script>
